<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#233f36"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="L's Majong"><meta name="description" content="Ad-free, offline Mahjong Solitaire."><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"><link rel="icon" type="image/svg+xml" href="./icons/icon.svg"><link rel="stylesheet" href="./styles/game.css"><script src="./src/ios-guard-early.js"></script><title>L's Majong</title><meta name="app-build" content="1.0.0-f62bf614e51e8d84"><meta name="app-version" content="1.0.0">
</head><body>
<div id="app" data-background="mist" data-board="sage" data-tile="ivory">
<div class="garden-scene" aria-hidden="true"></div>
<header class="topbar"><button id="journey-button" class="level-pill" aria-label="Levels"><span id="board-level">Level 1</span><span aria-hidden="true">›</span></button><span id="pairs-left" class="pairs-left"></span><span id="save-indicator" class="save-indicator" hidden></span><div class="header-actions"><button id="garden-button" class="coin-pill" aria-label="Garden shop"><span aria-hidden="true">✧</span><b id="coins">0</b></button><button id="help-button" class="icon-button" aria-label="How to play"><span aria-hidden="true">?</span></button><button id="settings-button" class="icon-button" aria-label="Settings"><span aria-hidden="true">⚙</span></button></div></header>
<main id="play-screen" class="play-screen">
<section class="board-shell" aria-label="Mahjong board"><div id="board-viewport" class="board-viewport image-area" tabindex="-1" aria-label="Tile board. Pinch or use zoom controls to enlarge. Drag to move when enlarged."><div id="board-world" class="board-world"></div><div id="loading" class="loading">Loading…</div></div><div class="zoom-controls" aria-label="Board zoom"><button id="zoom-out" aria-label="Zoom out">−</button><button id="zoom-fit" aria-label="Fit board">Fit</button><button id="zoom-in" aria-label="Zoom in">+</button></div></section>
<nav class="play-tools" aria-label="Game tools"><button id="hint-button"><span aria-hidden="true">☀</span><span>Hint</span></button><button id="undo-button" disabled><span aria-hidden="true">↶</span><span>Undo</span></button><button id="shuffle-button"><span aria-hidden="true">⤨</span><span>Shuffle</span></button></nav></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div><dialog id="modal"><div id="modal-content"></div></dialog><input id="restore-file" type="file" accept="application/json,.json" hidden></div>
<noscript><p style="padding:2rem">L's Majong needs JavaScript to play. Please enable it in your browser.</p></noscript><script type="module" src="./src/app.js"></script></body></html>
