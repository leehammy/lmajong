<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#233f36"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="L's Majong"><meta name="description" content="A peaceful garden, a pair of tiles, and a little time for yourself. An ad-free, offline Mahjong Solitaire journey."><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"><link rel="icon" type="image/svg+xml" href="./icons/icon.svg"><link rel="stylesheet" href="./styles/game.css"><script src="./src/ios-guard-early.js"></script><title>L's Majong</title></head><body>
<div id="app" data-background="mist" data-board="sage" data-tile="ivory">
<div class="garden-scene" aria-hidden="true"></div>
<header class="topbar"><a class="wordmark" href="./" aria-label="L's Majong home"><span class="brand-leaf" aria-hidden="true">❧</span><span>L's Majong<small>A LITTLE MOMENT OF PEACE</small></span></a><div class="header-actions"><span id="save-indicator" class="save-indicator">Your quiet garden</span><span class="coin-pill" aria-label="Garden coins"><span aria-hidden="true">✧</span> <b id="coins">0</b></span><button id="settings-button" class="icon-button" aria-label="Settings"><span aria-hidden="true">⚙</span></button></div></header>
<main id="play-screen" class="play-screen"><div class="journey-heading"><div><p class="eyebrow" id="chapter-label">THE GARDEN PATH</p><h1 id="level-title">A peaceful beginning</h1><p id="layout-label">Preparing your tiles…</p></div><button id="journey-button" class="journey-pill"><span aria-hidden="true">❧</span><span>My journey<small id="journey-count">Level 1</small></span><span aria-hidden="true">›</span></button></div>
<section class="board-shell" aria-label="Mahjong board"><div class="board-top"><span id="board-level">LEVEL 1</span><span id="pairs-left">Take your time</span><span class="board-flower" aria-hidden="true">✿</span></div><div id="board-viewport" class="board-viewport image-area" tabindex="-1" aria-label="Tile board. Pinch or use zoom controls to enlarge. Drag to move when enlarged."><div id="board-world" class="board-world"></div><div id="loading" class="loading">Opening your garden…</div></div><div class="board-bottom"><span id="board-message">Match two identical free tiles.</span><div class="zoom-controls" aria-label="Board zoom"><button id="zoom-out" aria-label="Zoom out">−</button><button id="zoom-fit" aria-label="Fit board">Fit</button><button id="zoom-in" aria-label="Zoom in">+</button></div></div></section>
<nav class="play-tools" aria-label="Game tools"><button id="hint-button"><span aria-hidden="true">☀</span><span>Hint<small>Always free</small></span></button><button id="undo-button" disabled><span aria-hidden="true">↶</span><span>Undo<small>Take a step back</small></span></button><button id="shuffle-button"><span aria-hidden="true">⤨</span><span>Reshuffle<small>A fresh possibility</small></span></button></nav>
<footer class="game-footer"><button id="garden-button">❧ &nbsp; My garden</button><span id="peace-note">No rush. Just one pair at a time.</span><button id="help-button">How to play &nbsp; ?</button></footer></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div><dialog id="modal"><div id="modal-content"></div></dialog><input id="restore-file" type="file" accept="application/json,.json" hidden></div>
<noscript><p style="padding:2rem">L's Majong needs JavaScript to play. Please enable it in your browser.</p></noscript><script type="module" src="./src/app.js"></script></body></html>
